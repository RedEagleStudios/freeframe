# ============================================================
# FreeFrame - behind Cloudflare's proxy (orange cloud), for docker-compose.prod.yml
# ============================================================
# Usage (instead of docker-compose.https.yml, not with it):
#   docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml -f docker-compose.cloudflare.yml up -d
#
# Cloudflare terminates the visitor's TLS; Traefik serves a Cloudflare Origin CA
# certificate on :443 so the zone can use SSL mode "Full (strict)". Requires, in
# CLOUDFLARE_ORIGIN_CERT_DIR (default ./certs, outside git):
#   origin.pem  the Origin CA certificate (SSL/TLS > Origin Server)
#   origin.key  its private key (mode 600)
# Also set CLIENT_IP_HEADER=cf-connecting-ip in .env.prod so rate limits see
# visitors rather than Cloudflare's edge, and firewall 80/443 to Cloudflare's
# ranges (see "Behind Cloudflare" in docs/deployment.md) - otherwise anyone can
# reach the origin directly and send that header.
# ============================================================

services:
  traefik:
    # A compose override replaces `command` whole, so the base flags are repeated;
    # the only addition is the file provider. The Let's Encrypt resolver stays
    # defined because the base routers name it; with path-only rules it never
    # requests a certificate, and the default certificate below is served.
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --providers.file.filename=/etc/traefik/dynamic/cloudflare-origin.yml
    volumes:
      - ./deploy/traefik/cloudflare-origin.yml:/etc/traefik/dynamic/cloudflare-origin.yml:ro
      - ${CLOUDFLARE_ORIGIN_CERT_DIR:-./certs}:/certs:ro

  api:
    labels:
      # Cloudflare forwards a plain-http visit to :80; send it back as https.
      - traefik.http.routers.api.middlewares=https-redirect,strip-api-prefix

  web:
    labels:
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.web.middlewares=https-redirect
