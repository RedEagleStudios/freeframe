name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/freeframe_test
      REDIS_URL: redis://localhost:6379/0
      S3_BUCKET: freeframe-test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: testkey
      S3_SECRET_KEY: testsecret
      S3_REGION: us-east-1
      JWT_SECRET: ci-test-secret-key-not-for-production
      FRONTEND_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: freeframe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Verify test files exist
        run: |
          TEST_COUNT=$(find apps/api/tests -name 'test_*.py' | wc -l)
          echo "Found $TEST_COUNT test files"
          if [ "$TEST_COUNT" -lt 5 ]; then
            echo "::error::Expected at least 5 test files but found $TEST_COUNT — test files may have been deleted"
            exit 1
          fi

      - name: Run database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest apps/api/tests/ -v --tb=short 2>&1 | tee test-output.txt
          # pipefail above makes this step fail on ANY test failure (zero-failure gate).
          # The floor below additionally guards against tests being deleted or gutted.
          PASSED=$(grep -oP '\d+ passed' test-output.txt | grep -oP '\d+')
          echo "Tests passed: $PASSED"
          if [ -z "$PASSED" ] || [ "$PASSED" -lt 40 ]; then
            echo "::error::Expected at least 40 tests to pass but got ${PASSED:-0} — tests may have been deleted or gutted"
            exit 1
          fi

      - name: Verify critical files exist
        run: |
          # Ensure core backend files haven't been deleted
          for f in \
            apps/api/main.py \
            apps/api/middleware/global_rate_limit.py \
            apps/api/middleware/rate_limit.py \
            apps/api/middleware/auth.py \
            apps/api/routers/auth.py \
            apps/api/routers/share.py \
            apps/api/routers/upload.py \
            apps/api/services/permissions.py \
            apps/api/services/redis_service.py \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::Critical file missing: $f"
              exit 1
            fi
          done
          echo "All critical backend files present"

      - name: Check imports resolve
        run: |
          python -c "
          from apps.api.main import app
          # Count API paths from the OpenAPI schema instead of len(app.routes): recent
          # FastAPI versions store lazy included-router wrappers, so app.routes no longer
          # reflects the real endpoint count (it drops sharply) while the schema still does.
          paths = len(app.openapi()['paths'])
          print(f'FastAPI app loaded: {paths} API paths')
          assert paths >= 30, f'Expected 30+ API paths but got {paths} — routers may have been removed'
          "

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Verify critical frontend files exist
        run: |
          for f in \
            package.json \
            app/layout.tsx \
            app/share/\[token\]/page.tsx \
            components/layout/sidebar.tsx \
            components/review/review-provider.tsx \
            components/review/comment-panel.tsx \
            components/share/folder-share-viewer.tsx \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::Critical file missing: apps/web/$f"
              exit 1
            fi
          done
          echo "All critical frontend files present"

      # docker-compose.dev.yml runs `npm install` on this manifest while every
      # other install path is pnpm, so an override npm rejects outright
      # (EOVERRIDE, #366) would otherwise go green. Resolution only, so
      # --ignore-scripts. A clean dir, because npm 10.x also crashes
      # ('edgesOut') next to a pnpm node_modules and a stray lockfile would hide
      # a real failure. npm 11 is pinned so the resolve does not run on the npm
      # bundled with whatever Node .nvmrc names: npm 10.9.8 crashes from scratch
      # on any manifest (#417). Drop the pin once the .nvmrc Node bundles an npm
      # other than 10.9.8. The outer `npx` is still that bundled npm, and it also
      # parses the package.json in this dir, so the pin narrows the dependency on
      # the bundled npm rather than removing it.
      - name: npm can still resolve apps/web
        run: |
          dir="$RUNNER_TEMP/npm-resolve"
          rm -rf "$dir" && mkdir -p "$dir"
          cp package.json "$dir/"
          cd "$dir"
          npx -y npm@11 --version
          npx -y npm@11 install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "::error::Build output directory .next does not exist"
            exit 1
          fi
          # Check key pages were built
          PAGE_COUNT=$(find .next -name '*.html' -o -name '*.js' | wc -l)
          echo "Build produced $PAGE_COUNT output files"
          if [ "$PAGE_COUNT" -lt 20 ]; then
            echo "::error::Build produced too few files ($PAGE_COUNT) — pages may have been removed"
            exit 1
          fi

  # ─── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Python deps
        run: pip install -r apps/api/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile apps/api/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Lint frontend
        run: pnpm lint
        working-directory: apps/web

  # ─── E2E type check ───────────────────────────────────────────────────────────
  # The Playwright suite in e2e/ drives a running stack, so CI does not run it,
  # but it must keep compiling. A standalone package with its own lockfile;
  # nothing here installs a browser.
  e2e-typecheck:
    name: E2E Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Type check
        run: pnpm typecheck

  # ─── Docker Build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build API image (dev)
        run: docker build -t freeframe-api:test -f apps/api/Dockerfile .

      - name: Build API image (prod)
        run: docker build -t freeframe-api:prod -f apps/api/Dockerfile.prod .

      - name: Test tooling is in the dev image and not the prod one
        run: |
          # The dev image is what every documented way of running the suite goes
          # through, and the prod image is where pytest must never ship. Both
          # directions are asserted, because a change that fixes one by breaking
          # the other looks green otherwise.
          docker run --rm freeframe-api:test python -m pytest --version
          if docker run --rm freeframe-api:prod python -m pytest --version 2>/dev/null; then
            echo "::error::pytest is installed in the production image"
            exit 1
          fi
          echo "dev has pytest, prod does not"

      - name: Build Web image (dev)
        run: docker build -t freeframe-web:test -f apps/web/Dockerfile apps/web/

      - name: Build Web image (prod)
        run: docker build -t freeframe-web:prod -f apps/web/Dockerfile.prod apps/web/

      - name: Verify docker-compose syntax
        run: |
          # Validate compose file syntax (skip env file resolution)
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.dev.yml'))" && echo "Dev compose YAML is valid"
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.prod.yml'))" && echo "Prod compose YAML is valid"
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.https.yml'))" && echo "HTTPS compose YAML is valid"
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.images.yml'))" && echo "Images compose YAML is valid"
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.storage.yml'))" && echo "Storage compose YAML is valid"

      - name: Verify the HTTPS compose override merges and needs DOMAIN
        run: |
          cp .env.example .env.prod
          https() { docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.https.yml "$@"; }
          DOMAIN=review.example.com ACME_EMAIL=ops@example.com https config -q
          echo "HTTPS override merges with the prod compose"
          # An empty DOMAIN has to fail loudly; without it the router would
          # match Host(``) and no certificate would be requested.
          if err=$(DOMAIN='' ACME_EMAIL=ops@example.com https config -q 2>&1); then
            echo "::error::an empty DOMAIN was accepted by docker-compose.https.yml"
            exit 1
          fi
          echo "$err" | grep -q DOMAIN || { echo "::error::the error does not name DOMAIN: $err"; exit 1; }
          echo "an empty DOMAIN is refused and named"

      - name: Verify the images and storage compose files merge
        run: |
          cp .env.example .env.prod
          base() { docker compose --env-file .env.prod -f docker-compose.prod.yml "$@"; }
          base -f docker-compose.images.yml config -q
          echo "images file merges with the prod compose"
          base -f docker-compose.images.yml -f docker-compose.storage.yml config -q
          echo "images and storage files merge with the prod compose"
          DOMAIN=review.example.com ACME_EMAIL=ops@example.com \
            STORAGE_DOMAIN=storage.review.example.com STORAGE_ROUTED=true \
            base -f docker-compose.images.yml -f docker-compose.https.yml -f docker-compose.storage.yml config -q
          echo "images, https and storage files merge with the prod compose"

  # ─── Installer ────────────────────────────────────────────────────────────────
  # deploy/freeframe and install.sh: ShellCheck and the bats suite, on the OS
  # the installer targets. Both tools are pinned, not taken from apt: Ubuntu
  # 22.04's bats (1.2.1) cannot run the suite (no BATS_TEST_TMPDIR), and an
  # apt version moves with the runner image. The suite runs on the runner
  # itself, not in the bats/bats image, so it meets GNU coreutils, flock,
  # setsid, systemd-analyze and the real `docker compose config`, which the
  # Alpine image lacks and skips.
  installer:
    name: Installer Lint and Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      BATS_VERSION: v1.14.0
      BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned ShellCheck and bats-core
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git bats-core
          commit=$(git -C bats-core rev-parse HEAD)
          if [ "$commit" != "$BATS_COMMIT" ]; then
            echo "::error::bats-core ${BATS_VERSION} is commit ${commit}, expected ${BATS_COMMIT}"
            exit 1
          fi
          sudo ./bats-core/install.sh /usr/local
          command -v shellcheck bats
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"
          bats --version | grep -qx "Bats ${BATS_VERSION#v}"
          shellcheck --version | sed -n 2p
          bats --version

      - name: ShellCheck
        run: shellcheck -x install.sh deploy/freeframe deploy/tests/ci-e2e.sh

      - name: bats
        run: |
          set -euo pipefail
          # The floor guards against the suite being deleted or gutted.
          count=$(bats --count deploy/tests)
          echo "bats tests: $count"
          if [ "$count" -lt 450 ]; then
            echo "::error::Expected at least 450 bats tests but found $count; tests may have been deleted"
            exit 1
          fi
          bats --timing deploy/tests

  # The installer for real, on a fresh runner (Docker 24+ with compose is
  # preinstalled, so it installs no Docker): both prod images are built from
  # this checkout as version `ci`, so nothing comes from the registry, and
  # each step below is one phase of deploy/tests/ci-e2e.sh, which says what it
  # checks. About 15 minutes, most of it the two image builds.
  installer-e2e:
    name: Installer End to End
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_ADMIN_EMAIL: ci@example.com

    steps:
      - uses: actions/checkout@v7

      - name: Check the runner and make the admin password
        run: bash deploy/tests/ci-e2e.sh prepare

      - name: Install refuses a FreeFrame set up by hand (exit 3, nothing written)
        run: bash deploy/tests/ci-e2e.sh foreign

      - name: Build the prod images as version ci
        run: bash deploy/tests/ci-e2e.sh build

      - name: Install (plain HTTP, storage on this server, unattended)
        run: bash deploy/tests/ci-e2e.sh install

      - name: Health, admin sign-in and a first project
        run: bash deploy/tests/ci-e2e.sh api

      - name: Backup, then restore drops a project made after it
        run: bash deploy/tests/ci-e2e.sh backup-restore

      - name: Update at the same version keeps the secrets
        run: bash deploy/tests/ci-e2e.sh update

      - name: Install again says already installed and changes nothing
        run: bash deploy/tests/ci-e2e.sh rerun

      - name: Status
        run: bash deploy/tests/ci-e2e.sh status

      - name: Diagnostics
        if: failure()
        run: bash deploy/tests/ci-e2e.sh diagnose
